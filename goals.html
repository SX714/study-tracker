<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目標計畫 — Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .goals-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      width: fit-content;
    }
    .goals-tab {
      padding: 8px 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
    }
    .goals-tab.active { background: var(--accent); color: #fff; }
    .goal-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .goal-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .goal-title { font-size: 1rem; font-weight: 700; }
    .goal-meta  { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }
    .goal-card-actions { display: flex; gap: 6px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">📚</span> Study Tracker
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">🏠</span> 儀表板</a></li>
      <li><a href="subjects.html"><span class="nav-icon">📖</span> 科目管理</a></li>
      <li><a href="timer.html"><span class="nav-icon">⏱️</span> 計時器</a></li>
      <li><a href="stats.html"><span class="nav-icon">📊</span> 統計圖表</a></li>
      <li><a href="goals.html"><span class="nav-icon">🎯</span> 目標計畫</a></li>
      <li><a href="settings.html"><span class="nav-icon">⚙️</span> 設定</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>🎯 目標計畫</h1>
        <p class="text-muted">設定每週／每月學習目標，追蹤達成進度</p>
      </div>
      <button class="btn btn-primary" id="add-goal-btn">＋ 新增目標</button>
    </div>

    <!-- Tab 切換 -->
    <div class="goals-tabs">
      <button class="goals-tab active" data-tab="active">📌 進行中</button>
      <button class="goals-tab" data-tab="done">✅ 已完成</button>
    </div>

    <!-- 目標列表 -->
    <div id="goals-list"></div>
  </main>

  <footer>© 2025 Study Tracker — 純前端學習追蹤工具</footer>
  <button class="ai-fab" id="ai-fab-btn" title="AI 學習助理">💬</button>

  <!-- Modal -->
  <div class="modal-backdrop" id="goal-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">新增目標</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">目標標題 *</label>
        <input type="text" class="form-input" id="f-title" placeholder="例：一月數學衝刺" maxlength="40">
      </div>

      <div class="form-group">
        <label class="form-label">對應科目</label>
        <select class="form-select" id="f-subject">
          <option value="">所有科目總計</option>
        </select>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">目標時數（分鐘）*</label>
          <input type="number" class="form-input" id="f-target" min="1" max="99999" placeholder="例：600">
        </div>
        <div class="form-group">
          <label class="form-label">週期</label>
          <select class="form-select" id="f-period">
            <option value="weekly">每週</option>
            <option value="monthly" selected>每月</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">開始日期 *</label>
          <input type="date" class="form-input" id="f-start">
        </div>
        <div class="form-group">
          <label class="form-label">結束日期 *</label>
          <input type="date" class="form-input" id="f-end">
        </div>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/ai-chat.js"></script>
  <script>
    let editingId = null;
    let currentTab = 'active';
    const subjects = loadData('st_subjects', []);
    const subMap   = Object.fromEntries(subjects.map(s => [s.id, s]));

    // 填入科目選單
    const fSubject = document.getElementById('f-subject');
    subjects.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.emoji || ''} ${s.name}`;
      fSubject.appendChild(opt);
    });

    function calcProgress(goal) {
      const sessions = loadData('st_sessions', []);
      return sessions
        .filter(s => isInRange(s.startAt.slice(0,10), goal.startDate, goal.endDate)
          && (!goal.subjectId || s.subjectId === goal.subjectId))
        .reduce((sum, s) => sum + (s.durationMinutes || 0), 0);
    }

    function renderGoals() {
      const goals   = loadData('st_goals', []);
      const today   = toDateStr();
      const active  = goals.filter(g => g.endDate >= today);
      const done    = goals.filter(g => g.endDate < today);
      const list    = currentTab === 'active' ? active : done;
      const el      = document.getElementById('goals-list');

      if (list.length === 0) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${currentTab === 'active' ? '🎯' : '✅'}</div>
          <p>${currentTab === 'active' ? '尚無進行中目標，點擊「新增目標」開始！' : '尚無已完成目標'}</p>
        </div>`;
        return;
      }

      el.innerHTML = list.map(g => {
        const subLabel = g.subjectId
          ? `${subMap[g.subjectId]?.emoji || ''} ${subMap[g.subjectId]?.name || '未知'}` : '所有科目';
        const done   = calcProgress(g);
        const pct    = Math.min(100, Math.round((done / g.targetMinutes) * 100));
        const remain = Math.ceil((new Date(g.endDate) - new Date()) / 86400000);
        const periodLabel = { weekly:'每週', monthly:'每月' }[g.period] || '';
        return `
          <div class="goal-card">
            <div class="goal-card-header">
              <div>
                <div class="goal-title">${g.title}</div>
                <div class="goal-meta">
                  <span class="badge badge-blue" style="margin-right:4px;">${subLabel}</span>
                  <span class="badge badge-gray" style="margin-right:4px;">${periodLabel}</span>
                  ${currentTab === 'active'
                    ? `<span style="color:${remain <= 3 ? 'var(--danger)' : 'var(--text-muted)'}">
                        剩 ${Math.max(0, remain)} 天</span>`
                    : `<span>已於 ${formatDate(g.endDate)} 結束</span>`}
                </div>
              </div>
              <div class="goal-card-actions">
                <button class="btn btn-ghost btn-sm" onclick="openEdit('${g.id}')">✏️</button>
                <button class="btn btn-ghost btn-sm" onclick="deleteGoal('${g.id}')">🗑️</button>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.82rem;
                        color:var(--text-muted); margin-bottom:6px;">
              <span>${formatMinutes(done)} / ${formatMinutes(g.targetMinutes)}</span>
              <span><strong style="color:${pct>=100?'var(--success)':pct>=60?'var(--accent)':'var(--warning)'}">
                ${pct}%</strong></span>
            </div>
            <div class="progress-wrap">
              <div class="progress-fill ${pct>=100?'success':pct>=60?'':'warning'}"
                   style="width:${pct}%"></div>
            </div>
          </div>`;
      }).join('');
    }

    function openModal(reset = true) {
      if (reset) {
        editingId = null;
        document.getElementById('modal-title').textContent = '新增目標';
        document.getElementById('f-title').value = '';
        document.getElementById('f-subject').value = '';
        document.getElementById('f-target').value = '';
        document.getElementById('f-period').value = 'monthly';
        document.getElementById('f-start').value = toDateStr();
        // 預設結束日為本月最後一天
        const r = getThisMonthRange();
        document.getElementById('f-end').value = r.end;
      }
      document.getElementById('goal-modal').classList.add('open');
    }

    function closeModal() { document.getElementById('goal-modal').classList.remove('open'); }

    function openEdit(id) {
      const goals = loadData('st_goals', []);
      const g = goals.find(x => x.id === id);
      if (!g) return;
      editingId = id;
      document.getElementById('modal-title').textContent = '編輯目標';
      document.getElementById('f-title').value   = g.title;
      document.getElementById('f-subject').value = g.subjectId || '';
      document.getElementById('f-target').value  = g.targetMinutes;
      document.getElementById('f-period').value  = g.period;
      document.getElementById('f-start').value   = g.startDate;
      document.getElementById('f-end').value     = g.endDate;
      openModal(false);
    }

    function deleteGoal(id) {
      if (!confirm('確定要刪除此目標？')) return;
      saveData('st_goals', loadData('st_goals', []).filter(g => g.id !== id));
      renderGoals();
    }

    document.getElementById('add-goal-btn').addEventListener('click', () => openModal());
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('goal-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('modal-save').addEventListener('click', () => {
      const title  = document.getElementById('f-title').value.trim();
      const target = parseInt(document.getElementById('f-target').value);
      const start  = document.getElementById('f-start').value;
      const end    = document.getElementById('f-end').value;
      if (!title)     { alert('請輸入目標標題'); return; }
      if (!target)    { alert('請輸入目標時數'); return; }
      if (!start||!end){ alert('請選擇日期範圍'); return; }
      if (start > end){ alert('開始日期不能晚於結束日期'); return; }

      const goals = loadData('st_goals', []);
      const entry = {
        subjectId: document.getElementById('f-subject').value || null,
        title, targetMinutes: target,
        period: document.getElementById('f-period').value,
        startDate: start, endDate: end
      };
      if (editingId) {
        const idx = goals.findIndex(g => g.id === editingId);
        if (idx !== -1) goals[idx] = { ...goals[idx], ...entry };
      } else {
        goals.push({ id: generateId(), ...entry, createdAt: new Date().toISOString() });
      }
      saveData('st_goals', goals);
      closeModal();
      renderGoals();
    });

    // Tab 切換
    document.querySelectorAll('.goals-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.goals-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        renderGoals();
      });
    });

    renderGoals();
  </script>
</body>
</html>
