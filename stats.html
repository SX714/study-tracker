<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計圖表 — Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-tab {
      padding: 7px 18px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .filter-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .chart-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .chart-card.full-width { grid-column: 1 / -1; }
    .chart-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .stats-table th {
      text-align: left; padding: 10px 12px;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted); font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stats-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .stats-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">📚</span> Study Tracker
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">🏠</span> 儀表板</a></li>
      <li><a href="subjects.html"><span class="nav-icon">📖</span> 科目管理</a></li>
      <li><a href="timer.html"><span class="nav-icon">⏱️</span> 計時器</a></li>
      <li><a href="stats.html"><span class="nav-icon">📊</span> 統計圖表</a></li>
      <li><a href="goals.html"><span class="nav-icon">🎯</span> 目標計畫</a></li>
      <li><a href="settings.html"><span class="nav-icon">⚙️</span> 設定</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>📊 統計圖表</h1>
        <p class="text-muted">分析你的學習時數與科目分佈</p>
      </div>
    </div>

    <!-- 日期篩選 -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-range="week">本週</button>
      <button class="filter-tab" data-range="month">本月</button>
      <button class="filter-tab" data-range="custom">自訂</button>
      <div id="custom-range" style="display:none; align-items:center; gap:8px;">
        <input type="date" class="form-input" id="date-start" style="width:auto; padding:6px 10px;">
        <span style="color:var(--text-muted)">～</span>
        <input type="date" class="form-input" id="date-end" style="width:auto; padding:6px 10px;">
        <button class="btn btn-primary btn-sm" id="apply-range">套用</button>
      </div>
    </div>

    <!-- 無資料空狀態 -->
    <div id="charts-empty" class="empty-state" style="display:none;">
      <div class="empty-icon">📭</div>
      <p>此區間尚無學習記錄</p>
      <p style="margin-top:8px; font-size:0.85rem;">
        前往<a href="timer.html">計時器</a>開始第一次學習，記錄就會出現在這裡！
      </p>
    </div>

    <!-- 圖表區（有資料時顯示） -->
    <div id="charts-area">
      <div class="charts-grid">
        <div class="chart-card full-width">
          <div class="chart-title">📅 每日學習時數（分鐘）</div>
          <canvas id="chart-daily" height="100"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">📈 每週趨勢（小時）</div>
          <canvas id="chart-weekly" height="200"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">🥧 科目時數分佈</div>
          <canvas id="chart-doughnut" height="200"></canvas>
        </div>
      </div>

      <!-- 統計表格 -->
      <div class="card">
        <div class="card-title mb-16">📋 各科目統計</div>
        <div id="stats-table-wrap">
          <table class="stats-table">
            <thead>
              <tr>
                <th>科目</th>
                <th>總時數</th>
                <th>學習次數</th>
                <th>平均每次</th>
                <th>完成番茄</th>
              </tr>
            </thead>
            <tbody id="stats-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer>© 2025 Study Tracker — 純前端學習追蹤工具</footer>
  <button class="ai-fab" id="ai-fab-btn" title="AI 學習助理">💬</button>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ai-chat.js"></script>
  <script>
    Chart.defaults.font.family = '-apple-system, "Segoe UI", system-ui, sans-serif';
    Chart.defaults.color = '#5a6a7e';

    let currentRange = 'week';
    let rangeStart, rangeEnd;
    let chartDaily, chartWeekly, chartDoughnut;

    const subjects = loadData('st_subjects', []);
    const subMap   = Object.fromEntries(subjects.map(s => [s.id, s]));

    function setRange(range) {
      currentRange = range;
      if (range === 'week') {
        const r = getThisWeekRange();
        rangeStart = r.start; rangeEnd = r.end;
      } else if (range === 'month') {
        const r = getThisMonthRange();
        rangeStart = r.start; rangeEnd = r.end;
      }
    }

    function getFilteredSessions() {
      return loadData('st_sessions', [])
        .filter(s => isInRange(s.startAt.slice(0,10), rangeStart, rangeEnd));
    }

    // 產生日期範圍陣列
    function dateRange(start, end) {
      const dates = [];
      let cur = new Date(start);
      const endDate = new Date(end);
      while (cur <= endDate) {
        dates.push(toDateStr(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return dates;
    }

    function drawCharts() {
      const sessions = getFilteredSessions();
      const dates    = dateRange(rangeStart, rangeEnd);

      // 無資料時顯示空狀態提示
      const noData = sessions.length === 0;
      document.getElementById('charts-empty').style.display = noData ? 'block' : 'none';
      document.getElementById('charts-area').style.display  = noData ? 'none'  : 'block';
      if (noData) return;


      // 每日時數
      const dailyData = dates.map(d =>
        sessions.filter(s => s.startAt.startsWith(d))
                .reduce((sum, s) => sum + (s.durationMinutes || 0), 0));

      if (chartDaily) chartDaily.destroy();
      chartDaily = new Chart(document.getElementById('chart-daily'), {
        type: 'bar',
        data: {
          labels: dates.map(d => d.slice(5)),
          datasets: [{ label: '學習時數（分鐘）', data: dailyData,
            backgroundColor: 'rgba(74,158,255,0.7)', borderRadius: 6 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 30 } } } }
      });

      // 每週趨勢（依週計算）
      const weeklyMap = {};
      sessions.forEach(s => {
        const d    = new Date(s.startAt);
        const day  = d.getDay() === 0 ? 6 : d.getDay() - 1; // 週一為起點
        const mono = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
        const wStart = toDateStr(mono);
        weeklyMap[wStart] = (weeklyMap[wStart] || 0) + (s.durationMinutes || 0);
      });
      const weekLabels = Object.keys(weeklyMap).sort();
      const weekData   = weekLabels.map(k => +(weeklyMap[k] / 60).toFixed(1));

      if (chartWeekly) chartWeekly.destroy();
      chartWeekly = new Chart(document.getElementById('chart-weekly'), {
        type: 'line',
        data: {
          labels: weekLabels.map(d => d.slice(5)),
          datasets: [{ label: '學習時數（小時）', data: weekData,
            borderColor: '#4a9eff', backgroundColor: 'rgba(74,158,255,0.1)',
            tension: 0.3, fill: true, pointRadius: 4 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } } }
      });

      // 科目分佈
      const subTotals = {};
      sessions.forEach(s => {
        subTotals[s.subjectId] = (subTotals[s.subjectId] || 0) + (s.durationMinutes || 0);
      });
      const dLabels = Object.keys(subTotals).map(id => subMap[id]?.name || '未知');
      const dData   = Object.values(subTotals);
      const dColors = Object.keys(subTotals).map(id => subMap[id]?.color || '#aaa');

      if (chartDoughnut) chartDoughnut.destroy();
      chartDoughnut = new Chart(document.getElementById('chart-doughnut'), {
        type: 'doughnut',
        data: { labels: dLabels,
          datasets: [{ data: dData, backgroundColor: dColors, borderWidth: 2 }] },
        options: { responsive: true,
          plugins: { legend: { position: 'bottom', labels: { padding: 14, font: { size: 12 } } } } }
      });

      // 統計表格
      const tbody = document.getElementById('stats-tbody');
      if (Object.keys(subTotals).length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted" style="padding:24px;">
          此區間尚無學習記錄</td></tr>`;
        return;
      }
      tbody.innerHTML = Object.entries(subTotals)
        .sort((a,b) => b[1] - a[1])
        .map(([id, total]) => {
          const sub = subMap[id] || {};
          const subSessions = sessions.filter(s => s.subjectId === id);
          const avg = Math.round(total / subSessions.length);
          const pomodoros = subSessions.filter(s => s.mode === 'pomodoro' && s.completed).length;
          return `<tr>
            <td><span style="color:${sub.color||'#aaa'};margin-right:6px;">●</span>
                ${sub.emoji || ''} ${sub.name || '未知'}</td>
            <td><strong>${formatMinutes(total)}</strong></td>
            <td>${subSessions.length} 次</td>
            <td>${formatMinutes(avg)}</td>
            <td>${pomodoros} 🍅</td>
          </tr>`;
        }).join('');
    }

    // 篩選 Tab 事件
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('custom-range').style.display =
          tab.dataset.range === 'custom' ? 'flex' : 'none';
        if (tab.dataset.range !== 'custom') {
          setRange(tab.dataset.range);
          drawCharts();
        }
      });
    });

    document.getElementById('apply-range').addEventListener('click', () => {
      rangeStart = document.getElementById('date-start').value;
      rangeEnd   = document.getElementById('date-end').value;
      if (!rangeStart || !rangeEnd) { alert('請選擇起訖日期'); return; }
      drawCharts();
    });

    setRange('week');
    drawCharts();
  </script>
</body>
</html>
