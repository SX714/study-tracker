<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計時器 — Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .timer-container {
      max-width: 500px;
      margin: 0 auto;
    }
    .mode-tabs {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .mode-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
      border: none;
      background: none;
    }
    .mode-tab.active {
      background: var(--accent);
      color: #fff;
    }
    .timer-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 36px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
      margin-bottom: 20px;
    }
    .timer-phase-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    .timer-display {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 24px;
      font-variant-numeric: tabular-nums;
    }
    .timer-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .pomodoro-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
    }
    .pomodoro-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .pomodoro-dot.done { background: var(--accent); }
    .pomodoro-dot.current { background: var(--warning); }
    .session-log { margin-top: 20px; }
    .session-log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      try {
        var s = localStorage.getItem('st_settings');
        var mode = s ? (JSON.parse(s).themeMode || 'system') : 'system';
        if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.body.classList.add('dark');
      } catch(e) {}
    })();
  </script>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">📚</span> Study Tracker
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">🏠</span> 主頁</a></li>
      <li><a href="subjects.html"><span class="nav-icon">📖</span> 學習項目</a></li>
      <li><a href="timer.html" class="active"><span class="nav-icon">⏱️</span> 計時器</a></li>
      <li><a href="stats.html"><span class="nav-icon">📊</span> 統計圖表</a></li>
      <li><a href="goals.html"><span class="nav-icon">🎯</span> 目標計畫</a></li>
      <li><a href="diary.html"><span class="nav-icon">📓</span> 日記</a></li>
      <li><a href="settings.html"><span class="nav-icon">⚙️</span> 設定</a></li>
    </ul>
    <div class="nav-right">
      <div id="nav-user-avatar-wrap" style="display:none; cursor:pointer;" title="已登入" onclick="location.href='settings.html'">
        <img id="nav-user-avatar" src="" alt="頭像" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.5);">
      </div>
      <button class="nav-hamburger" aria-label="選單">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>⏱️ 專注計時器</h1>
        <p class="text-muted">番茄鐘或自由計時，開始累積學習時數</p>
      </div>
    </div>

    <div class="timer-container">
      <!-- 模式切換 -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="pomodoro">🍅 番茄鐘</button>
        <button class="mode-tab" data-mode="free">⏱ 自由計時</button>
      </div>

      <!-- 學習項目選擇 -->
      <div class="form-group mb-24">
        <label class="form-label">選擇學習項目 *</label>
        <select class="form-select" id="subject-select">
          <option value="">— 請選擇學習項目 —</option>
        </select>
      </div>

      <!-- 計時器主畫面 -->
      <div class="timer-card">
        <div class="timer-phase-label" id="phase-label">專注時間</div>
        <div class="timer-display" id="timer-display">25:00</div>

        <!-- 番茄進度點（番茄鐘模式用）-->
        <div class="pomodoro-dots" id="pomodoro-dots">
          <div class="pomodoro-dot" data-index="0"></div>
          <div class="pomodoro-dot" data-index="1"></div>
          <div class="pomodoro-dot" data-index="2"></div>
          <div class="pomodoro-dot" data-index="3"></div>
        </div>

        <div class="timer-controls">
          <button class="btn btn-primary btn-lg" id="start-btn">▶ 開始</button>
          <button class="btn btn-ghost btn-lg" id="stop-free-btn" style="display:none;">⏹ 停止並儲存</button>
          <button class="btn btn-ghost btn-lg" id="reset-btn">↺ 重置</button>
        </div>
      </div>

      <!-- 本次記錄 -->
      <div class="session-log" id="session-log">
        <div class="card-title mb-16">📋 本次工作階段</div>
        <div id="session-log-list">
          <p style="font-size:0.85rem; color:var(--text-muted);">尚無完成記錄</p>
        </div>
      </div>
    </div>
  </main>

  <footer>© 2025 Study Tracker — 純前端學習追蹤工具</footer>
  <button class="ai-fab" id="ai-fab-btn" title="AI 學習助理">💬</button>

  <!-- 日記記錄 Modal -->
  <div class="modal-backdrop" id="diary-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>📓 記錄學習心得</h2>
        <button class="modal-close" id="diary-modal-close">✕</button>
      </div>

      <!-- 本次計時摘要 -->
      <div class="diary-summary" id="diary-summary"></div>

      <div class="form-group">
        <label class="form-label">學習心得（選填）</label>
        <textarea class="form-textarea" id="diary-content" rows="4" placeholder="今天學了什麼？有什麼想記錄的？"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">心情評分</label>
        <div class="mood-stars" id="mood-stars">
          <button class="mood-star" data-val="1" title="很差">★</button>
          <button class="mood-star" data-val="2" title="不太好">★</button>
          <button class="mood-star" data-val="3" title="普通">★</button>
          <button class="mood-star" data-val="4" title="不錯">★</button>
          <button class="mood-star" data-val="5" title="很棒">★</button>
        </div>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
        <button class="btn btn-ghost" id="diary-skip-btn">跳過</button>
        <button class="btn btn-primary" id="diary-save-btn">💾 儲存日記</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/ai-chat.js"></script>
  <script>
    // 設定讀取
    const settings = loadData('st_settings', {
      pomodoroMinutes: 25, shortBreakMinutes: 5,
      longBreakMinutes: 15, longBreakInterval: 4
    });

    const PHASES = {
      work:       { label: '🍅 專注時間', minutes: settings.pomodoroMinutes || 25 },
      shortBreak: { label: '☕ 短休息',   minutes: settings.shortBreakMinutes || 5 },
      longBreak:  { label: '🛌 長休息',   minutes: settings.longBreakMinutes || 15 }
    };

    let mode        = 'pomodoro'; // 'pomodoro' | 'free'
    let phase       = 'work';     // 'work' | 'shortBreak' | 'longBreak'
    let running     = false;
    let intervalId  = null;
    let remaining   = PHASES.work.minutes * 60; // 秒
    let elapsed     = 0;   // 自由計時用（秒）
    let pomodoroRound = 0; // 已完成的番茄數（0-3）
    let sessionStart  = null;
    const sessionLog  = [];

    // 載入學習項目
    const subjects = loadData('st_subjects', []);
    const sel = document.getElementById('subject-select');
    subjects.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.emoji || ''} ${s.name}`;
      sel.appendChild(opt);
    });

    // URL 參數預選
    const params = new URLSearchParams(location.search);
    if (params.get('subject')) sel.value = params.get('subject');
    if (params.get('mode') === 'free') switchMode('free');

    // 切換學習項目時，若番茄在進行中詢問是否重置
    sel.addEventListener('change', () => {
      if (mode === 'pomodoro' && running) {
        const restart = confirm('切換學習項目，是否重新開始目前的番茄鐘？\n\n【確定】重新開始　【取消】繼續計時（只換項目）');
        if (restart) {
          resetTimer();
        }
        // 無論如何都允許換項目，resetTimer 會 pause 而不是阻止切換
      }
    });

    // 模式切換 Tab
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => switchMode(tab.dataset.mode));
    });

    function switchMode(m) {
      mode = m;
      document.querySelectorAll('.mode-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.mode === m));
      resetTimer();
      document.getElementById('pomodoro-dots').style.display =
        m === 'pomodoro' ? 'flex' : 'none';
      document.getElementById('stop-free-btn').style.display =
        m === 'free' ? 'inline-flex' : 'none';
      if (m === 'free') {
        document.getElementById('phase-label').textContent = '⏱ 自由計時';
        document.getElementById('timer-display').textContent = '00:00:00';
      }
    }

    function updateDisplay() {
      const secs = mode === 'free' ? elapsed : remaining;
      if (mode === 'free') {
        const hh = String(Math.floor(secs / 3600)).padStart(2, '0');
        const mm = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
        const ss = String(secs % 60).padStart(2, '0');
        document.getElementById('timer-display').textContent = `${hh}:${mm}:${ss}`;
      } else {
        const mm = String(Math.floor(secs / 60)).padStart(2, '0');
        const ss = String(secs % 60).padStart(2, '0');
        document.getElementById('timer-display').textContent = `${mm}:${ss}`;
      }
    }

    function updateDots() {
      document.querySelectorAll('.pomodoro-dot').forEach((dot, i) => {
        dot.classList.remove('done', 'current');
        if (i < pomodoroRound) dot.classList.add('done');
        else if (i === pomodoroRound && phase === 'work') dot.classList.add('current');
      });
    }

    function startTimer() {
      if (!sel.value) { alert('請先選擇學習項目！'); return; }
      running = true;
      sessionStart = sessionStart || new Date();
      document.getElementById('start-btn').textContent = '⏸ 暫停';
      document.getElementById('start-btn').classList.replace('btn-primary', 'btn-warning');

      intervalId = setInterval(() => {
        if (mode === 'free') {
          elapsed++;
        } else {
          remaining--;
          if (remaining <= 0) {
            clearInterval(intervalId);
            onPomodoroPhaseEnd();
            return;
          }
        }
        updateDisplay();
      }, 1000);
    }

    function pauseTimer() {
      running = false;
      clearInterval(intervalId);
      document.getElementById('start-btn').textContent = '▶ 繼續';
      document.getElementById('start-btn').classList.replace('btn-warning', 'btn-primary');
    }

    function resetTimer() {
      // 番茄鐘 work 階段：若已開始計時，把已過的時間儲存為未完成記錄
      if (mode === 'pomodoro' && phase === 'work' && sessionStart) {
        const elapsed_pomo = PHASES.work.minutes * 60 - remaining;
        if (elapsed_pomo > 0) {
          const subjectId = sel.value;
          if (subjectId) saveSession(elapsed_pomo, false);
        }
      }
      pauseTimer();
      elapsed = 0;
      remaining = PHASES[phase].minutes * 60;
      sessionStart = null;
      document.getElementById('start-btn').textContent = '▶ 開始';
      document.getElementById('start-btn').classList.remove('btn-warning');
      document.getElementById('start-btn').classList.add('btn-primary');
      updateDisplay();
    }

    // ── 日記 Modal ──────────────────────────────────────
    let diaryMood = 3;
    let pendingDiarySession = null; // { subjectId, subName, durationSeconds }

    function openDiaryModal(subjectId, subName, durationSeconds) {
      pendingDiarySession = { subjectId, subName, durationSeconds };
      diaryMood = 3;

      // 摘要區（顯示到秒）
      document.getElementById('diary-summary').innerHTML =
        `<div><strong>${subName}</strong></div>` +
        `<div>⏱ ${formatDuration(durationSeconds)}</div>`;

      // 清空心得
      document.getElementById('diary-content').value = '';

      // 預設星星
      updateMoodStars(3);

      document.getElementById('diary-modal').classList.add('open');
    }

    function closeDiaryModal() {
      document.getElementById('diary-modal').classList.remove('open');
      pendingDiarySession = null;
    }

    function updateMoodStars(val) {
      diaryMood = val;
      document.querySelectorAll('#mood-stars .mood-star').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.val) <= val);
      });
    }

    // 星星點擊
    document.querySelectorAll('#mood-stars .mood-star').forEach(btn => {
      btn.addEventListener('click', () => updateMoodStars(Number(btn.dataset.val)));
    });

    document.getElementById('diary-modal-close').addEventListener('click', closeDiaryModal);
    document.getElementById('diary-skip-btn').addEventListener('click', closeDiaryModal);

    document.getElementById('diary-save-btn').addEventListener('click', () => {
      if (!pendingDiarySession) return;
      const { subjectId } = pendingDiarySession;
      const content = document.getElementById('diary-content').value.trim();
      const entry = {
        id: generateId(),
        sessionId: '',
        subjectId,
        content,
        mood: diaryMood,
        createdAt: new Date().toISOString()
      };
      const diary = loadData('st_diary', []);
      diary.push(entry);
      saveData('st_diary', diary);
      closeDiaryModal();
    });
    // ── 日記 Modal 結束 ─────────────────────────────────

    // 儲存 session（以秒為單位，同時保留 durationMinutes 供舊邏輯相容）
    function saveSession(durationSeconds, completed) {
      const subjectId = sel.value;
      if (!subjectId || durationSeconds < 1) return;
      const durationMinutes = durationSeconds / 60; // 保留小數，精確到秒
      const session = {
        id: generateId(), subjectId, mode,
        startAt: (sessionStart || new Date()).toISOString(),
        durationSeconds,          // 新欄位：精確秒數
        durationMinutes,          // 相容舊邏輯（浮點分鐘）
        completed
      };
      const sessions = loadData('st_sessions', []);
      sessions.push(session);
      saveData('st_sessions', sessions);

      const subName = subjects.find(s => s.id === subjectId)?.name || '未知';
      sessionLog.push({ subName, durationSeconds, mode, completed });
      renderSessionLog();

      // 計時完成後彈出日記 Modal
      if (completed) {
        openDiaryModal(subjectId, subName, durationSeconds);
      }
    }

    function onPomodoroPhaseEnd() {
      if (phase === 'work') {
        saveSession(PHASES.work.minutes * 60, true);
        pomodoroRound++;
        if (pomodoroRound >= (settings.longBreakInterval || 4)) {
          pomodoroRound = 0;
          phase = 'longBreak';
        } else {
          phase = 'shortBreak';
        }
      } else {
        phase = 'work';
      }
      remaining = PHASES[phase].minutes * 60;
      document.getElementById('phase-label').textContent = PHASES[phase].label;
      updateDisplay();
      updateDots();
      notifyUser(PHASES[phase].label);
      sessionStart = new Date();
      startTimer();
    }

    function renderSessionLog() {
      const el = document.getElementById('session-log-list');
      if (sessionLog.length === 0) {
        el.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted);">尚無完成記錄</p>';
        return;
      }
      el.innerHTML = sessionLog.map(s => `
        <div class="session-log-item">
          <span>${s.mode === 'pomodoro' ? '🍅' : '⏱'} ${s.subName}</span>
          <span class="badge badge-${s.completed ? 'green' : 'gray'}">
            ${formatDuration(s.durationSeconds)}
          </span>
        </div>`).join('');
    }

    function notifyUser(nextPhase) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Study Tracker', { body: `下一階段：${nextPhase}`, icon: '📚' });
      }
    }

    // 請求通知權限
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // 按鈕事件
    document.getElementById('start-btn').addEventListener('click', () => {
      running ? pauseTimer() : startTimer();
    });

    // 自由計時「停止並儲存」按鈕
    document.getElementById('stop-free-btn').addEventListener('click', () => {
      if (elapsed < 1) { alert('尚未開始計時'); return; }
      const subjectId = sel.value;
      if (!subjectId) { alert('請先選擇學習項目！'); return; }
      const subName = subjects.find(s => s.id === subjectId)?.name || '未知';
      const secs = elapsed;
      saveSession(secs, true);
      resetTimer();
      openDiaryModal(subjectId, subName, secs);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if (mode === 'free' && elapsed > 0) {
        if (confirm('確定要重置？目前計時將儲存為一筆記錄。')) {
          const secs = elapsed;
          const subjectId = sel.value;
          const subName = subjects.find(s => s.id === subjectId)?.name || '未知';
          saveSession(secs, false);
          resetTimer();
        }
      } else if (mode === 'pomodoro' && phase === 'work' && sessionStart &&
                 PHASES.work.minutes * 60 - remaining > 0) {
        if (confirm('確定要重置？已計時的部分將儲存為一筆未完成記錄。')) {
          resetTimer(); // resetTimer 內部會自動儲存未完成秒數
        }
      } else {
        resetTimer();
      }
    });

    // 離頁提示：計時進行中時警告
    window.addEventListener('beforeunload', e => {
      if (running) {
        e.preventDefault();
        e.returnValue = '計時器正在運行中，離開頁面將中斷計時，確定要離開嗎？';
      }
    });

    // 初始化
    updateDisplay();
    updateDots();
  </script>
</body>
</html>
