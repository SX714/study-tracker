<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科目管理 — Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .subject-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-top: 4px solid var(--subject-color, var(--accent));
      position: relative;
    }
    .subject-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .subject-emoji { font-size: 1.8rem; }
    .subject-name  { font-size: 1rem; font-weight: 700; }
    .subject-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .priority-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }
    .color-options {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
    }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%;
      cursor: pointer; border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-swatch.selected, .color-swatch:hover {
      transform: scale(1.15); border-color: var(--text);
    }
    .emoji-picker {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .emoji-btn {
      font-size: 1.4rem; cursor: pointer; padding: 4px 6px;
      border-radius: 6px; border: 2px solid transparent;
      background: var(--bg); transition: border-color 0.15s;
    }
    .emoji-btn.selected, .emoji-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">📚</span> Study Tracker
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">🏠</span> 儀表板</a></li>
      <li><a href="subjects.html"><span class="nav-icon">📖</span> 科目管理</a></li>
      <li><a href="timer.html"><span class="nav-icon">⏱️</span> 計時器</a></li>
      <li><a href="stats.html"><span class="nav-icon">📊</span> 統計圖表</a></li>
      <li><a href="goals.html"><span class="nav-icon">🎯</span> 目標計畫</a></li>
      <li><a href="settings.html"><span class="nav-icon">⚙️</span> 設定</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>📖 科目管理</h1>
        <p class="text-muted">新增、編輯或刪除學習科目</p>
      </div>
      <button class="btn btn-primary" id="add-subject-btn">＋ 新增科目</button>
    </div>

    <div class="subjects-grid" id="subjects-grid">
      <!-- 由 JS 動態渲染 -->
    </div>
  </main>

  <footer>© 2025 Study Tracker — 純前端學習追蹤工具</footer>
  <button class="ai-fab" id="ai-fab-btn" title="AI 學習助理">💬</button>

  <!-- Modal -->
  <div class="modal-backdrop" id="subject-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">新增科目</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">科目名稱 *</label>
        <input type="text" class="form-input" id="f-name" placeholder="例：數學" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label">圖示 Emoji</label>
        <div class="emoji-picker" id="emoji-picker"></div>
      </div>

      <div class="form-group">
        <label class="form-label">顏色標籤</label>
        <div class="color-options" id="color-options"></div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">每日目標（分鐘）</label>
          <input type="number" class="form-input" id="f-daily" min="0" max="600" value="60">
        </div>
        <div class="form-group">
          <label class="form-label">優先等級</label>
          <select class="form-select" id="f-priority">
            <option value="high">🔴 高</option>
            <option value="medium" selected>🟡 中</option>
            <option value="low">🟢 低</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">備註</label>
        <textarea class="form-textarea" id="f-note" placeholder="可選填…"></textarea>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    const EMOJIS  = ['📖','✏️','➗','⚛️','🧪','🌿','📜','🗺️','⚖️','🔬','💻','🎵','🏃','🌏','🧮','📐'];
    const COLORS  = ['#4a9eff','#8e44ad','#e74c3c','#27ae60','#f39c12','#16a085','#2980b9','#d35400','#c0392b','#1a5276'];
    const PRIORITY_COLOR = { high:'#ef4444', medium:'#f59e0b', low:'#22c55e' };

    let editingId = null;
    let selectedEmoji = EMOJIS[0];
    let selectedColor = COLORS[0];

    // 初始化 emoji 選擇器
    const emojiPicker = document.getElementById('emoji-picker');
    EMOJIS.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn' + (e === selectedEmoji ? ' selected' : '');
      btn.textContent = e;
      btn.type = 'button';
      btn.addEventListener('click', () => {
        selectedEmoji = e;
        emojiPicker.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      emojiPicker.appendChild(btn);
    });

    // 初始化顏色選擇器
    const colorOpts = document.getElementById('color-options');
    COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
      sw.style.background = c;
      sw.addEventListener('click', () => {
        selectedColor = c;
        colorOpts.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        sw.classList.add('selected');
      });
      colorOpts.appendChild(sw);
    });

    function renderSubjects() {
      const subjects = loadData('st_subjects', []);
      const sessions = loadData('st_sessions', []);
      const today    = toDateStr();
      const grid     = document.getElementById('subjects-grid');

      if (subjects.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;padding:60px 0;">
          <div class="empty-icon">📭</div>
          <p>尚無科目，點擊「新增科目」開始吧！</p></div>`;
        return;
      }

      grid.innerHTML = subjects.map(s => {
        const todayMin = sessions
          .filter(r => r.subjectId === s.id && r.startAt.startsWith(today))
          .reduce((sum, r) => sum + (r.durationMinutes || 0), 0);
        const pct = s.dailyTargetMinutes
          ? Math.min(100, Math.round((todayMin / s.dailyTargetMinutes) * 100)) : 0;
        const priorityLabel = { high:'高', medium:'中', low:'低' }[s.priority] || '中';
        return `
          <div class="subject-card" style="--subject-color:${s.color}">
            <div class="subject-card-header">
              <span class="subject-emoji">${s.emoji || '📖'}</span>
              <div>
                <div class="subject-name">${s.name}</div>
                <span class="badge badge-gray" style="margin-top:2px;">
                  <span class="priority-dot" style="background:${PRIORITY_COLOR[s.priority] || '#aaa'}"></span>
                  優先：${priorityLabel}
                </span>
              </div>
            </div>
            <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:6px;">
              今日：${formatMinutes(todayMin)} / ${formatMinutes(s.dailyTargetMinutes || 0)}
            </div>
            <div class="progress-wrap">
              <div class="progress-fill ${pct >= 100 ? 'success' : ''}" style="width:${pct}%"></div>
            </div>
            ${s.note ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">${s.note}</div>` : ''}
            <div class="subject-card-actions">
              <button class="btn btn-outline btn-sm w-full" onclick="openEdit('${s.id}')">✏️ 編輯</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteSubject('${s.id}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    function openModal(reset = true) {
      if (reset) {
        editingId = null;
        document.getElementById('modal-title').textContent = '新增科目';
        document.getElementById('f-name').value = '';
        document.getElementById('f-daily').value = 60;
        document.getElementById('f-priority').value = 'medium';
        document.getElementById('f-note').value = '';
        setEmoji(EMOJIS[0]);
        setColor(COLORS[0]);
      }
      document.getElementById('subject-modal').classList.add('open');
    }

    function closeModal() { document.getElementById('subject-modal').classList.remove('open'); }

    function setEmoji(e) {
      selectedEmoji = e;
      emojiPicker.querySelectorAll('.emoji-btn').forEach(b => {
        b.classList.toggle('selected', b.textContent === e);
      });
    }

    function setColor(c) {
      selectedColor = c;
      colorOpts.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.toggle('selected', s.style.background === c ||
          s.style.background === hexToRgb(c));
      });
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function openEdit(id) {
      const subjects = loadData('st_subjects', []);
      const s = subjects.find(x => x.id === id);
      if (!s) return;
      editingId = id;
      document.getElementById('modal-title').textContent = '編輯科目';
      document.getElementById('f-name').value = s.name;
      document.getElementById('f-daily').value = s.dailyTargetMinutes || 60;
      document.getElementById('f-priority').value = s.priority || 'medium';
      document.getElementById('f-note').value = s.note || '';
      setEmoji(s.emoji || EMOJIS[0]);
      setColor(s.color || COLORS[0]);
      openModal(false);
    }

    function deleteSubject(id) {
      if (!confirm('確定要刪除此科目？相關計時記錄將保留。')) return;
      const subjects = loadData('st_subjects', []).filter(s => s.id !== id);
      saveData('st_subjects', subjects);
      renderSubjects();
    }

    document.getElementById('add-subject-btn').addEventListener('click', () => openModal());
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('subject-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('modal-save').addEventListener('click', () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) { alert('請輸入科目名稱'); return; }
      const subjects = loadData('st_subjects', []);
      if (editingId) {
        const idx = subjects.findIndex(s => s.id === editingId);
        if (idx !== -1) subjects[idx] = { ...subjects[idx], name,
          emoji: selectedEmoji, color: selectedColor,
          dailyTargetMinutes: parseInt(document.getElementById('f-daily').value) || 60,
          priority: document.getElementById('f-priority').value,
          note: document.getElementById('f-note').value.trim() };
      } else {
        subjects.push({ id: generateId(), name, emoji: selectedEmoji, color: selectedColor,
          dailyTargetMinutes: parseInt(document.getElementById('f-daily').value) || 60,
          priority: document.getElementById('f-priority').value,
          note: document.getElementById('f-note').value.trim(),
          createdAt: new Date().toISOString() });
      }
      saveData('st_subjects', subjects);
      closeModal();
      renderSubjects();
    });

    renderSubjects();
  </script>
</body>
</html>
