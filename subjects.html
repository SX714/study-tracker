<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習項目 — Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .subject-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-top: 4px solid var(--subject-color, var(--accent));
      position: relative;
    }
    .subject-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .subject-emoji { font-size: 1.8rem; }
    .subject-name  { font-size: 1rem; font-weight: 700; }
    .subject-card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .priority-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }
    /* 顏色選擇器：調色盤 input + 預覽色塊 */
    .color-picker-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .color-picker-wrap input[type="color"] {
      width: 44px;
      height: 44px;
      padding: 2px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: var(--surface);
    }
    .color-preview-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid var(--border);
      flex-shrink: 0;
    }
    /* 預設色快速選 */
    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .color-preset-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-preset-dot:hover, .color-preset-dot.selected {
      transform: scale(1.18);
      border-color: var(--text);
    }
    .emoji-picker {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
    }
    .emoji-btn {
      font-size: 1.4rem; cursor: pointer; padding: 4px 6px;
      border-radius: 6px; border: 2px solid transparent;
      background: var(--bg); transition: border-color 0.15s;
    }
    .emoji-btn.selected, .emoji-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <script>
    (function() {
      try {
        var s = localStorage.getItem('st_settings');
        var mode = s ? (JSON.parse(s).themeMode || 'system') : 'system';
        if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches))
          document.body.classList.add('dark');
      } catch(e) {}
    })();
  </script>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">📚</span> Study Tracker
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><span class="nav-icon">🏠</span> 主頁</a></li>
      <li><a href="subjects.html" class="active"><span class="nav-icon">📖</span> 學習項目</a></li>
      <li><a href="timer.html"><span class="nav-icon">⏱️</span> 計時器</a></li>
      <li><a href="stats.html"><span class="nav-icon">📊</span> 統計圖表</a></li>
      <li><a href="goals.html"><span class="nav-icon">🎯</span> 目標計畫</a></li>
      <li><a href="diary.html"><span class="nav-icon">📓</span> 日記</a></li>
      <li><a href="settings.html"><span class="nav-icon">⚙️</span> 設定</a></li>
    </ul>
    <div class="nav-right">
      <div id="nav-user-avatar-wrap" style="display:none; cursor:pointer;" title="已登入" onclick="location.href='settings.html'">
        <img id="nav-user-avatar" src="" alt="頭像" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.5);">
      </div>
      <button class="nav-hamburger" aria-label="選單">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div>
        <h1>📖 學習項目管理</h1>
        <p class="text-muted">新增、編輯或刪除學習項目</p>
      </div>
      <button class="btn btn-primary" id="add-subject-btn">＋ 新增學習項目</button>
    </div>

    <div class="subjects-grid" id="subjects-grid">
      <!-- 由 JS 動態渲染 -->
    </div>
  </main>

  <footer>© 2025 Study Tracker — 純前端學習追蹤工具</footer>
  <button class="ai-fab" id="ai-fab-btn" title="AI 學習助理">💬</button>

  <!-- Modal -->
  <div class="modal-backdrop" id="subject-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">新增學習項目</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">項目名稱 *</label>
        <input type="text" class="form-input" id="f-name" placeholder="例：數學" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label">圖示 Emoji</label>
        <div class="emoji-picker" id="emoji-picker"></div>
      </div>

      <div class="form-group">
        <label class="form-label">顏色標籤</label>
        <div class="color-picker-wrap">
          <input type="color" id="color-picker-input" value="#4a9eff" title="點擊開啟調色盤">
          <div class="color-preview-swatch" id="color-preview-swatch" style="background:#4a9eff;"></div>
          <span style="font-size:0.82rem; color:var(--text-muted);">可直接輸入或調色盤選色</span>
        </div>
        <div class="color-presets" id="color-presets"></div>
      </div>

      <div class="form-row-2col" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label class="form-label">每日目標（分鐘）</label>
          <input type="number" class="form-input" id="f-daily" min="0" max="600" value="60">
        </div>
        <div class="form-group">
          <label class="form-label">優先等級</label>
          <select class="form-select" id="f-priority">
            <option value="high">🔴 高</option>
            <option value="medium" selected>🟡 中</option>
            <option value="low">🟢 低</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">備註</label>
        <textarea class="form-textarea" id="f-note" placeholder="可選填…"></textarea>
      </div>

      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button class="btn btn-ghost" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/ai-chat.js"></script>
  <script>
    const EMOJIS  = ['📖','✏️','➗','⚛️','🧪','🌿','📜','🗺️','⚖️','🔬','💻','🎵','🏃','🌏','🧮','📐'];
    const PRESET_COLORS = ['#4a9eff','#8e44ad','#e74c3c','#27ae60','#f39c12','#16a085','#2980b9','#d35400','#c0392b','#1a5276'];
    const PRIORITY_COLOR = { high:'#ef4444', medium:'#f59e0b', low:'#22c55e' };

    let editingId = null;
    let selectedEmoji = EMOJIS[0];
    let selectedColor = PRESET_COLORS[0];

    // 初始化 emoji 選擇器
    const emojiPicker = document.getElementById('emoji-picker');
    EMOJIS.forEach(e => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn' + (e === selectedEmoji ? ' selected' : '');
      btn.textContent = e;
      btn.type = 'button';
      btn.addEventListener('click', () => {
        selectedEmoji = e;
        emojiPicker.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      emojiPicker.appendChild(btn);
    });

    // 初始化調色盤
    const colorInput = document.getElementById('color-picker-input');
    const colorPreview = document.getElementById('color-preview-swatch');

    colorInput.addEventListener('input', () => {
      selectedColor = colorInput.value;
      colorPreview.style.background = selectedColor;
      // 取消預設色點選取狀態
      document.querySelectorAll('.color-preset-dot').forEach(d => {
        d.classList.toggle('selected', d.dataset.color === selectedColor);
      });
    });

    // 初始化預設顏色快速選
    const colorPresetsEl = document.getElementById('color-presets');
    PRESET_COLORS.forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'color-preset-dot' + (c === selectedColor ? ' selected' : '');
      dot.style.background = c;
      dot.dataset.color = c;
      dot.title = c;
      dot.addEventListener('click', () => {
        selectedColor = c;
        colorInput.value = c;
        colorPreview.style.background = c;
        document.querySelectorAll('.color-preset-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
      });
      colorPresetsEl.appendChild(dot);
    });

    function setColor(c) {
      selectedColor = c;
      colorInput.value = c;
      colorPreview.style.background = c;
      document.querySelectorAll('.color-preset-dot').forEach(d => {
        d.classList.toggle('selected', d.dataset.color === c);
      });
    }

    function renderSubjects() {
      const subjects = loadData('st_subjects', []);
      const sessions = loadData('st_sessions', []);
      const today    = toDateStr();
      const grid     = document.getElementById('subjects-grid');

      if (subjects.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;padding:60px 0;">
          <div class="empty-icon">📭</div>
          <p>尚無學習項目，點擊「新增學習項目」開始吧！</p></div>`;
        return;
      }

      grid.innerHTML = subjects.map(s => {
        // 支援新 durationSeconds 也相容舊 durationMinutes
        const todaySecs = sessions
          .filter(r => r.subjectId === s.id && r.startAt.startsWith(today))
          .reduce((sum, r) => sum + (r.durationSeconds || (r.durationMinutes || 0) * 60), 0);
        const todayMin = todaySecs / 60;
        const pct = s.dailyTargetMinutes
          ? Math.min(100, Math.round((todayMin / s.dailyTargetMinutes) * 100)) : 0;
        const priorityLabel = { high:'高', medium:'中', low:'低' }[s.priority] || '中';
        return `
          <div class="subject-card" style="--subject-color:${s.color}">
            <div class="subject-card-header">
              <span class="subject-emoji">${s.emoji || '📖'}</span>
              <div>
                <div class="subject-name">${s.name}</div>
                <span class="badge badge-gray" style="margin-top:2px;">
                  <span class="priority-dot" style="background:${PRIORITY_COLOR[s.priority] || '#aaa'}"></span>
                  優先：${priorityLabel}
                </span>
              </div>
            </div>
            <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:6px;">
              今日：${formatDuration(todaySecs)} / ${formatMinutes(s.dailyTargetMinutes || 0)}
            </div>
            <div class="progress-wrap">
              <div class="progress-fill ${pct >= 100 ? 'success' : ''}" style="width:${pct}%"></div>
            </div>
            ${s.note ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">${s.note}</div>` : ''}
            <div class="subject-card-actions">
              <a href="timer.html?subject=${s.id}&mode=pomodoro"
                 class="btn btn-primary btn-sm" style="flex:1; text-align:center;">▶ 計時</a>
              <button class="btn btn-outline btn-sm" onclick="openEdit('${s.id}')">✏️</button>
              <button class="btn btn-ghost btn-sm" onclick="deleteSubject('${s.id}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    function openModal(reset = true) {
      if (reset) {
        editingId = null;
        document.getElementById('modal-title').textContent = '新增學習項目';
        document.getElementById('f-name').value = '';
        document.getElementById('f-daily').value = 60;
        document.getElementById('f-priority').value = 'medium';
        document.getElementById('f-note').value = '';
        setEmoji(EMOJIS[0]);
        setColor(PRESET_COLORS[0]);
      }
      document.getElementById('subject-modal').classList.add('open');
    }

    function closeModal() { document.getElementById('subject-modal').classList.remove('open'); }

    function setEmoji(e) {
      selectedEmoji = e;
      emojiPicker.querySelectorAll('.emoji-btn').forEach(b => {
        b.classList.toggle('selected', b.textContent === e);
      });
    }

    function openEdit(id) {
      const subjects = loadData('st_subjects', []);
      const s = subjects.find(x => x.id === id);
      if (!s) return;
      editingId = id;
      document.getElementById('modal-title').textContent = '編輯學習項目';
      document.getElementById('f-name').value = s.name;
      document.getElementById('f-daily').value = s.dailyTargetMinutes || 60;
      document.getElementById('f-priority').value = s.priority || 'medium';
      document.getElementById('f-note').value = s.note || '';
      setEmoji(s.emoji || EMOJIS[0]);
      setColor(s.color || PRESET_COLORS[0]);
      openModal(false);
    }

    function deleteSubject(id) {
      if (!confirm('確定要刪除此學習項目？相關計時記錄將保留。')) return;
      const subjects = loadData('st_subjects', []).filter(s => s.id !== id);
      saveData('st_subjects', subjects);
      renderSubjects();
    }

    document.getElementById('add-subject-btn').addEventListener('click', () => openModal());
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('subject-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.getElementById('modal-save').addEventListener('click', () => {
      const name = document.getElementById('f-name').value.trim();
      if (!name) { alert('請輸入項目名稱'); return; }
      const subjects = loadData('st_subjects', []);
      if (editingId) {
        const idx = subjects.findIndex(s => s.id === editingId);
        if (idx !== -1) subjects[idx] = { ...subjects[idx], name,
          emoji: selectedEmoji, color: selectedColor,
          dailyTargetMinutes: parseInt(document.getElementById('f-daily').value) || 60,
          priority: document.getElementById('f-priority').value,
          note: document.getElementById('f-note').value.trim() };
      } else {
        subjects.push({ id: generateId(), name, emoji: selectedEmoji, color: selectedColor,
          dailyTargetMinutes: parseInt(document.getElementById('f-daily').value) || 60,
          priority: document.getElementById('f-priority').value,
          note: document.getElementById('f-note').value.trim(),
          createdAt: new Date().toISOString() });
      }
      saveData('st_subjects', subjects);
      closeModal();
      renderSubjects();
    });

    renderSubjects();
  </script>
</body>
</html>
